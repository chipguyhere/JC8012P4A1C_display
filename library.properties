sentence=JD9365 MIPI-DSI display + GSL3680 touch driver for the JC8012P4A1C ESP32-P4 LCD, with PPA hardware rotation for LVGL
paragraph=Self-contained display and capacitive-touch driver for the Guition JC8012P4A1C ESP32-P4 board with an 800x1280 JD9365 MIPI-DSI panel and a GSL3680 touch controller. LVGL renders a full native-resolution frame and the ESP32-P4 PPA (Pixel Processing Accelerator) rotates it into a DSI framebuffer in hardware, so all four orientations are free. Ships LVGL 9.3 examples (a hand-written Claude Code stub, bouncing balls, a calculator, and a SquareLine Studio launcher) with display, touch, and LVGL plumbing already wired up. Requires PSRAM, and chipguy_JC8012P4A1C_board for the shared I2C bus the touch controller is on. The touch controller's firmware is installed once per board by chipguy_ESP32-P4-C6-firmware-installer.
